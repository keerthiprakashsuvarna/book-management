
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Book Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Online Book Management System</h1>

    <h2>Book Details</h2>

    <input type="number" id="id" placeholder="Book ID" min="1">
    <input type="text" id="title" placeholder="Book Title">
    <input type="text" id="author" placeholder="Author Name">
    <input type="number" id="price" placeholder="Price" min="0" step="0.01">

    <div class="buttons">
      <button onclick="addBook()">Add Book</button>
      <button onclick="updateBook()">Update Book</button>
      <button onclick="deleteBook()">Delete Book</button>
      <button onclick="searchBook()">Search Book</button>
      <button onclick="getBooks()">View All Books</button>
    </div>

    <p id="message" role="status"></p>

    <h2>Book List</h2>

    <table>
      <thead>
        <tr>
          <th>Book ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="bookList"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
